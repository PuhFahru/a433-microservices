apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongo-pv
spec:
  # Provide local persistent storage for MongoDB in minikube.
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/mongo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc
spec:
  # Claim the MongoDB persistent volume for the stateful workload.
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 1Gi
  volumeName: mongo-pv
