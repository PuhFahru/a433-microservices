version: "3.8"

services:
  item-app:
    # Use the application image that has been pushed to Docker Hub.
    image: fahp19/item-app:v1
    # Publish the container's port 8080 on port 80 of the host.
    ports:
      - "80:8080"
    # Start the application only after the database service is created.
    depends_on:
      - item-db
    # Restart the container automatically to improve resilience.
    restart: always

  item-db:
    # Use MongoDB version 3 as required by the project criteria.
    image: mongo:3
    # Persist MongoDB data in a named Docker volume.
    volumes:
      - app-db:/data/db
    # Restart the database automatically if it stops unexpectedly.
    restart: always

volumes:
  # Declare the named volume used by the MongoDB service.
  app-db:
