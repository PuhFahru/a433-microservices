name: karsajobs-ui-ci

on:
  # Run the frontend pipeline whenever the frontend branch changes.
  push:
    branches:
      - karsajobs-ui
  pull_request:
    branches:
      - karsajobs-ui

jobs:
  lint-dockerfile:
    # Lint the frontend Dockerfile with hadolint as requested by the reviewer.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  build-app-karsajobs-ui:
    # Build and push the frontend image after the Dockerfile passes linting.
    runs-on: ubuntu-latest
    needs:
      - lint-dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/karsajobs-ui:latest
