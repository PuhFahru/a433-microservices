name: karsajobs-ci

on:
  # Run the backend pipeline whenever the backend branch changes.
  push:
    branches:
      - karsajobs
  pull_request:
    branches:
      - karsajobs

jobs:
  lint-dockerfile:
    # Lint the backend Dockerfile with hadolint as requested by the reviewer.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  test-app:
    # Run the backend unit tests using the command specified in the project tips.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.15"

      - name: Run backend tests
        run: go test -v -short --count=1 $(go list ./...)

  build-app-karsajobs:
    # Build and push the backend image after linting and tests pass.
    runs-on: ubuntu-latest
    needs:
      - lint-dockerfile
      - test-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/karsajobs:latest
